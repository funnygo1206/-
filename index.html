<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>걱정하쥐마!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- ==================== 메인 화면 ==================== -->
    <div id="main-screen">

        <!-- 로그인 / 회원가입 -->
        <div class="top-bar">
            <button id="open-login" class="top-button">로그인</button>
            <button id="open-signup" class="top-button">회원가입</button>
            <button id="profile-button" class="profile-button" style="display: none;" aria-label="프로필">👤</button>
        </div>

        <!-- 메인 기능 버튼 -->
        <div class="main-menu">
            <button id="open-map" class="main-button">1. 근처 가게 찾아보기</button>
            <button id="open-search" class="main-button">2. 주변 가게 검색하기</button>
            <button class="main-button">3. 우리 가게 등록하기</button>
        </div>

        <!-- 아래 기능 카드 -->
        <div class="feature-grid">

            <div class="feature-card">
                <div class="feature-icon">📍</div>
                <h3>근처 가게</h3>
            </div>

            <div class="feature-card">
                <div class="feature-icon">🔍</div>
                <h3>가게 검색</h3>
            </div>

            <div class="feature-card">
                <div class="feature-icon">🏪</div>
                <h3>가게</h3>
            </div>

            <div class="feature-card">
                <div class="feature-icon">🐭</div>
                <h3>동물 정보</h3>
            </div>

            <div class="feature-card">
                <div class="feature-icon">🛒</div>
                <h3>용품 찾기</h3>
            </div>

            <div class="feature-card">
                <div class="feature-icon">⭐</div>
                <h3>추천 기능</h3>
            </div>

        </div>

    </div>


    <!-- ==================== 지도 화면 ==================== -->
    <div id="map-screen" class="sub-screen">
        <button id="map-back" class="back-button">←</button>
        <h2>근처 가게 찾아보기</h2>
        <div id="map"></div>
    </div>


    <!-- ==================== 회원가입 화면 ==================== -->
    <div id="signup-screen" class="sub-screen">
        <button id="signup-back" class="back-button">←</button>
        <h2>회원가입</h2>

        <div class="form-area">
            <input type="email" id="signup-email" placeholder="이메일">
            <input type="password" id="signup-password" placeholder="비밀번호">
            <input type="password" id="signup-password-check" placeholder="비밀번호 확인">
            <button id="signup-submit">회원가입</button>
        </div>

        <p id="signup-message"></p>
    </div>


    <!-- ==================== 로그인 화면 ==================== -->
    <div id="login-screen" class="sub-screen">
        <button id="login-back" class="back-button">←</button>
        <h2>로그인</h2>

        <div class="form-area">
            <input type="email" id="login-email" placeholder="이메일">
            <input type="password" id="login-password" placeholder="비밀번호">
            <button id="login-submit">로그인</button>
        </div>

        <p id="login-message"></p>
    </div>


    <!-- ==================== 프로필 화면 ==================== -->
    <div id="profile-screen" class="sub-screen">
        <button id="profile-back" class="back-button" type="button">←</button>
        <h2>내 프로필</h2>

        <div class="profile-area">
            <div class="profile-big-icon">👤</div>

            <p><strong>이메일</strong></p>
            <p id="profile-email">-</p>

            <p><strong>사용자 ID</strong></p>
            <p id="profile-id">-</p>

            <p><strong>가입일</strong></p>
            <p id="profile-created">-</p>
        </div>
    </div>


    <!-- ==================== 검색 화면 ==================== -->
    <div id="search-screen">
        <button id="back-button" class="back-button">←</button>

        <div class="search-box">
            <input type="text" id="shop-name" placeholder="샵 이름으로 검색">

            <label for="region">지역</label>
            <select id="region">
                <option value="">지역을 선택하세요</option>
                <option value="서울">서울</option>
                <option value="경기도">경기도</option>
                <option value="인천">인천</option>
            </select>

            <label for="animal">동물</label>
            <select id="animal">
                <option value="">동물을 선택하세요</option>
                <option value="햄스터">햄스터</option>
                <option value="쥐">쥐</option>
                <option value="기니피그">기니피그</option>
                <option value="토끼">토끼</option>
            </select>

            <button class="search-button">검색하기</button>
        </div>
    </div>

</div>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=jdz0pgkfth"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 내가 만든 JavaScript -->
<script src="script.js"></script>

</body>
</html>
